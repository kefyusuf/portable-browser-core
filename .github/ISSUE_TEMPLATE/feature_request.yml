name: Change proposal
description: Propose a milestone-scoped change (new semantics require an ADR)
labels: [proposal]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and how it respects the boundaries — the ADR-004 frozen boundary (no OS APIs, networking, filesystem), determinism, and total semantics.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: How acceptance would be proven — golden cases, structural checks, CI gates.
    validations:
      required: true
