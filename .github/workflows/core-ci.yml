name: Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-core:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.98.1 fmt --all -- --check
      - name: Test
        run: cargo +1.98.1 test --workspace --locked
      - name: Clippy
        run: cargo +1.98.1 clippy --workspace --all-targets --locked -- -D warnings
      - name: WASM target compile
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-unknown-unknown --toolchain 1.98.1
          cargo +1.98.1 check --workspace --locked --target wasm32-unknown-unknown
      - name: WASM binding cdylib build
        if: matrix.os == 'ubuntu-latest'
        run: cargo +1.98.1 build -p browser-core-wasm --locked --target wasm32-unknown-unknown
      - name: WASM binding tests (Node)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo +1.98.1 install wasm-bindgen-cli --version 0.2.129 --locked
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner cargo +1.98.1 test -p browser-core-wasm --locked --target wasm32-unknown-unknown
      - name: Assemble npm package
        if: matrix.os == 'ubuntu-latest'
        run: |
          wasm-bindgen --version
          wasm-bindgen --target nodejs --out-dir crates/browser-core-wasm/pkg/nodejs target/wasm32-unknown-unknown/debug/browser_core_wasm.wasm
          wasm-bindgen --target bundler --out-dir crates/browser-core-wasm/pkg/bundler target/wasm32-unknown-unknown/debug/browser_core_wasm.wasm
          wasm-bindgen --target web --out-dir crates/browser-core-wasm/pkg/web target/wasm32-unknown-unknown/debug/browser_core_wasm.wasm
          cp crates/browser-core-wasm/npm/package.json crates/browser-core-wasm/pkg/package.json
          ls -R crates/browser-core-wasm/pkg
      - name: Verify multi-target package structure
        if: matrix.os == 'ubuntu-latest'
        run: node crates/browser-core-wasm/tests/verify-targets.cjs
      - name: npm package smoke test (Node)
        if: matrix.os == 'ubuntu-latest'
        run: node crates/browser-core-wasm/tests/smoke.cjs
