name: Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-core:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Cache cargo state
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          cache-all-crates: true
      - name: Format
        run: cargo +1.98.1 fmt --all -- --check
      - name: Test
        run: cargo +1.98.1 test --workspace --locked
      - name: Clippy
        run: cargo +1.98.1 clippy --workspace --all-targets --locked -- -D warnings
      - name: WASM target compile
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-unknown-unknown --toolchain 1.98.1
          cargo +1.98.1 check --workspace --locked --target wasm32-unknown-unknown
      - name: WASM binding cdylib build
        if: matrix.os == 'ubuntu-latest'
        run: cargo +1.98.1 build -p browser-core-wasm --locked --target wasm32-unknown-unknown
      - name: WASM binding tests (Node)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo +1.98.1 install wasm-bindgen-cli --version 0.2.129 --locked
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner cargo +1.98.1 test -p browser-core-wasm --locked --target wasm32-unknown-unknown
      - name: Assemble npm package
        if: matrix.os == 'ubuntu-latest'
        run: |
          wasm-bindgen --version
          wasm-bindgen --target nodejs --out-dir crates/browser-core-wasm/pkg/nodejs target/wasm32-unknown-unknown/debug/browser_core_wasm.wasm
          wasm-bindgen --target bundler --out-dir crates/browser-core-wasm/pkg/bundler target/wasm32-unknown-unknown/debug/browser_core_wasm.wasm
          wasm-bindgen --target web --out-dir crates/browser-core-wasm/pkg/web target/wasm32-unknown-unknown/debug/browser_core_wasm.wasm
          cp crates/browser-core-wasm/npm/package.json crates/browser-core-wasm/pkg/package.json
          ls -R crates/browser-core-wasm/pkg
      - name: Verify multi-target package structure
        if: matrix.os == 'ubuntu-latest'
        run: node crates/browser-core-wasm/tests/verify-targets.cjs
      - name: npm package smoke test (Node)
        if: matrix.os == 'ubuntu-latest'
        run: node crates/browser-core-wasm/tests/smoke.cjs
      - name: Agent loop example (Node)
        if: matrix.os == 'ubuntu-latest'
        run: node examples/agent-loop.cjs

  cargo-deny:
    name: Cargo deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache cargo state
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          cache-all-crates: true
      - name: Install cargo-deny
        run: cargo +1.98.1 install cargo-deny --locked
      - name: Check
        run: cargo +1.98.1 deny check

  cargo-fuzz:
    name: Cargo fuzz (bounded campaign)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned nightly
        run: rustup toolchain install nightly-2026-11-10 --profile minimal
      - name: Cache cargo state
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          cache-all-crates: true
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-11-10 install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo +nightly-2026-11-10 fuzz build
      - name: Campaign — resolve_navigation (60s)
        run: cargo +nightly-2026-11-10 fuzz run resolve_navigation -- -max_total_time=60
      - name: Campaign — from_session_text (60s)
        run: cargo +nightly-2026-11-10 fuzz run from_session_text -- -max_total_time=60
      - name: Campaign — from_workspace_text (60s)
        run: cargo +nightly-2026-11-10 fuzz run from_workspace_text -- -max_total_time=60
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore
