[package]
name = "browser-core-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Thin, decision-free WASM/JS bridge over the browser decision core"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
browser-core = { version = "=0.1.0", path = "../browser-core" }
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"

[dev-dependencies]
wasm-bindgen-test = "0.3.79"
