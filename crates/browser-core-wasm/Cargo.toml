[package]
name = "browser-core-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Thin, decision-free WASM/JS bridge over the browser decision core"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
browser-core = { version = "=0.1.0", path = "../browser-core" }
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"

[dev-dependencies]
# Locked to the wasm-bindgen 0.2.129 pairing (ADR-020): the trio —
# wasm-bindgen, wasm-bindgen-test, and CI's wasm-bindgen-cli — moves in
# lockstep (0.2.N ↔ 0.2.N ↔ 0.3.(N-50)).
wasm-bindgen-test = "=0.3.79"
